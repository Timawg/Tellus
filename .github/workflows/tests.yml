name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios-tests:
    name: iOS tests
    runs-on: xcode-27
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Select iOS simulator
        id: simulator
        shell: bash
        run: |
          find_iphone() {
            awk '
              /Available destinations|Destinations compatible/ { eligible = 1; next }
              /Ineligible destinations|Destinations incompatible/ { eligible = 0 }
              eligible && /platform: *iOS Simulator,/ && /name: *iPhone / && !id {
                if (match($0, /id: *[[:xdigit:]-]+,/)) {
                  id = substr($0, RSTART + 3, RLENGTH - 4)
                  gsub(/ /, "", id)
                }
              }
              END { if (id) print id }
            ' <<< "$1"
          }

          xcodebuild -version
          simulator_id=
          for attempt in 1 2 3; do
            if destinations=$(xcodebuild -project Tellus.xcodeproj -scheme Tellus -disableAutomaticPackageResolution -showdestinations 2>&1); then
              simulator_id=$(find_iphone "$destinations")
              if [[ -n "$simulator_id" ]]; then
                break
              fi
            fi
            if [[ "$attempt" != 3 ]]; then
              echo "No eligible iPhone simulator on attempt $attempt. Retrying in 5 seconds."
              sleep 5
            fi
          done

          if [[ -z "$simulator_id" ]]; then
            printf '%s\n' "$destinations"
            xcrun simctl list runtimes || true
            xcrun simctl list devices available || true
            echo "::error::The runner did not expose an iPhone simulator for Tellus."
            exit 1
          fi

          echo "Using iOS simulator $simulator_id"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run unit and UI tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: >
          xcodebuild
          -project Tellus.xcodeproj
          -scheme Tellus
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -disableAutomaticPackageResolution
          -parallel-testing-enabled NO
          -enableCodeCoverage YES
          -resultBundlePath "$RUNNER_TEMP/TellusTests.xcresult"
          DEVELOPMENT_TEAM=
          CODE_SIGN_IDENTITY=-
          test

      - name: Report Tellus code coverage
        shell: bash
        run: |
          report="$RUNNER_TEMP/TellusCoverage.json"
          xcrun xccov view --report --json "$RUNNER_TEMP/TellusTests.xcresult" > "$report"

          python3 - "$report" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report:
              targets = json.load(report)["targets"]

          app = next((target for target in targets if target["name"] == "Tellus.app"), None)
          if app is None or app["executableLines"] == 0:
              sys.exit("No executable line coverage found for Tellus.app.")

          print("## Tellus code coverage\n")
          print(f'**{app["lineCoverage"]:.2%}** line coverage '
                f'({app["coveredLines"]:,} of {app["executableLines"]:,} executable lines).\n')
          print("Download the **TellusCoverage** artifact for the detailed Xcode coverage report.")
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TellusCoverage
          path: ${{ runner.temp }}/TellusCoverage.json
          if-no-files-found: error

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TellusTests
          path: ${{ runner.temp }}/TellusTests.xcresult
          if-no-files-found: ignore
